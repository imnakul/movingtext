<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1017"/>
      <stop offset="100%" stop-color="#08090C"/>
    </linearGradient>

    <!-- Accent glow gradient (Peacock Blue to Radiant Indigo) -->
    <linearGradient id="venuGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Notch Glass Surface Gradient -->
    <linearGradient id="glassSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242938" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#12151E" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Gold Flute / Jewel Accent -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <!-- Filter for soft neon glow -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Box with sleek border -->
  <rect width="800" height="200" rx="24" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="799" height="199" rx="23.5" stroke="#1E2330" stroke-width="1"/>

  <!-- Left Icon Emblem (Dynamic Island + Flute Harmony) -->
  <g transform="translate(48, 44)">
    <!-- Ambient Radial Glow behind Notch Icon -->
    <circle cx="56" cy="56" r="46" fill="url(#venuGlow)" opacity="0.18" filter="url(#glowFilter)"/>

    <!-- Icon Base Tile -->
    <rect x="0" y="0" width="112" height="112" rx="26" fill="#131620" stroke="#252B3B" stroke-width="1.5"/>

    <!-- Floating Dynamic Island Notch Representation -->
    <rect x="18" y="24" width="76" height="26" rx="13" fill="url(#glassSurface)" stroke="url(#venuGlow)" stroke-width="1.5"/>

    <!-- Notch Rim Highlight Specular Line -->
    <path d="M 28 26 L 84 26" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" stroke-linecap="round"/>

    <!-- Media / Sound Rhythm Wave Nodes inside Notch (Flute melody metaphor) -->
    <circle cx="34" cy="37" r="3.5" fill="#38BDF8"/>
    <rect x="44" y="32" width="3" height="10" rx="1.5" fill="#818CF8"/>
    <rect x="51" y="29" width="3" height="16" rx="1.5" fill="#A855F7"/>
    <rect x="58" y="33" width="3" height="8" rx="1.5" fill="#818CF8"/>
    <circle cx="78" cy="37" r="3" fill="url(#goldAccent)"/>

    <!-- Lower Bezel Expansion Arc -->
    <rect x="26" y="62" width="60" height="24" rx="8" fill="#1A1F2C" stroke="#2E374D" stroke-width="1"/>
    <!-- Miniature Status Row lines -->
    <circle cx="38" cy="74" r="2.5" fill="#10B981"/>
    <rect x="46" y="72" width="28" height="4" rx="2" fill="#4B5563"/>
  </g>

  <!-- Typography & Branding Area -->
  <g transform="translate(196, 52)">
    <!-- Main Title -->
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif" font-size="46" font-weight="800" fill="#F8FAFC" letter-spacing="-1">
      Venu
    </text>

    <!-- Version / Architecture Badge -->
    <g transform="translate(132, 16)">
      <rect x="0" y="0" width="78" height="22" rx="6" fill="#1E2433" stroke="#333D56" stroke-width="1"/>
      <text x="39" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="0.5">
        WINDOWS
      </text>
    </g>

    <!-- Tagline (SEO Optimized) -->
    <text x="1" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif" font-size="16" font-weight="600" fill="#94A3B8" letter-spacing="0.1">
      Dynamic Notch for Windows
    </text>

    <!-- Feature Pillars List -->
    <text x="1" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748B">
      <tspan fill="#38BDF8">Live Glass Blur</tspan>
      <tspan fill="#475569">  •  </tspan>
      <tspan fill="#818CF8">Media HUD</tspan>
      <tspan fill="#475569">  •  </tspan>
      <tspan fill="#A855F7">Desktop Alerts</tspan>
      <tspan fill="#475569">  •  </tspan>
      <tspan fill="#10B981">Built in Rust</tspan>
    </text>
  </g>
</svg>
